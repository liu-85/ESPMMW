substitutions:
  # 显示名称可以带横杠
  device_name: minild2410c
  # 内部 ID 必须用下划线，这是修复报错的关键
  device_id: minild2410c

esphome:
  name: ${device_name}
  friendly_name: minild2410c
  on_boot:
    priority: -100
    then:
      - delay: 5s

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: debug
debug:
  update_interval: 5s

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 5min

ota:
  - platform: esphome
    password: !secret ota_password
  - platform: web_server

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: on

web_server:
  port: 80
  version: 3
  include_internal: true

# UART 配置
uart:
  id: ld2410_uart
  tx_pin: GPIO17
  rx_pin: GPIO21
  baud_rate: 256000
  

# LD2410 核心组件
ld2410:
  uart_id: ld2410_uart

# 文本传感器
text_sensor:
  - platform: wifi_info
    ip_address:
      name: ${device_name}_ip
      icon: mdi:ip-outline
      internal: true
    mac_address:
      name: ${device_name}_mac
      icon: mdi:map-marker-outline
      internal: true
  - platform: version
    name: ${device_name}_esphome_version
    icon: mdi:information
    internal: true

# 二进制传感器
binary_sensor:
  # 这是你在 HA 中需要的第一个核心实体：有人/无人
  - platform: ld2410
    has_target:
      name: "${device_name} Presence"
      device_class: occupancy

# 传感器
sensor:
  # 这是你在 HA 中需要的第二个核心实体：光照
  - platform: adc
    pin: 3
    name: ${device_name}_brightness
    attenuation: 11db
    update_interval: 5s
    unit_of_measurement: "lx"
    icon: mdi:brightness-6
    accuracy_decimals: 0
    filters:
      - lambda: |-
          return ( 3 - x ) / 0.03;

  # 以下传感器设为内部，仅供 Web 端或调试查看，不会在 HA 产生多余实体
  - platform: ld2410
    moving_distance:
      name: "Moving Distance"
      internal: true
    still_distance:
      name: "Still Distance"
      internal: true
    moving_energy:
      name: "Moving Energy"
      internal: true
    still_energy:
      name: "Still Energy"
      internal: true
  
  - platform: debug
    free:
      name: "Heap Free"
      internal: true
    loop_time:
      name: "Loop Time"
      internal: true

# 数值控制 (Web 页面可调参数)
number:
  - platform: ld2410
    # 这个 timeout 就是你想要的“无人持续时间/超时时间”
    timeout:
      name: "LD2410 Timeout"
    max_move_distance_gate:
      name: "Max Move Distance"
    max_still_distance_gate:
      name: "Max Still Distance"
    light_threshold:
      name: "Light Threshold"
# 开关控制 (包含蓝牙和工程模式)
switch:
  - platform: ld2410
    engineering_mode:
      name: "${device_name} Engineering Mode"
    bluetooth:
      name: "${device_name} Bluetooth"
      restore_mode: ALWAYS_OFF

# 按钮控制
button:
  - platform: ld2410
    factory_reset:
      name: "LD2410 Factory Reset"
    restart:
      name: "LD2410 Sensor Restart"
  - platform: restart
    name: "ESP Restart"
