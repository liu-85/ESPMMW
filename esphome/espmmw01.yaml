substitutions:
  device_name: espmmw01

esphome:
  name: ${device_name}
  friendly_name: ${device_name}
  on_boot:
    priority: -100
    then:
      - delay: 5s

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

external_components:
  - source: github://liu-85/ESPMMW
    components: [ra2413mt]

logger:
  level: debug

api:
  encryption:
    key: !secret api_encryption_key

ota:
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: on

web_server:
  port: 80

uart:
  - id: ra2413mt_uart
    rx_pin: 5
    tx_pin: 6
    baud_rate: 256000

ra2413mt:
  uart_id: ra2413mt_uart

light:
  - platform: esp32_rmt_led_strip
    id: status_led
    pin: GPIO7
    num_leds: 1
    chipset: WS2812
    rgb_order: GRB
    name: ${device_name}_status_led
    restore_mode: ALWAYS_OFF

globals:
  - id: saved_ir_codes
    type: std::array<std::string, 10>
    restore_value: no
    initial_value: '{"", "", "", "", "", "", "", "", "", ""}'
  - id: temp_ir_code
    type: std::string
    restore_value: no
    initial_value: ""

text_sensor:
  - platform: wifi_info
    ip_address:
      name: ${device_name}_ip
      internal: true
    mac_address:
      name: ${device_name}_mac
      internal: true
  - platform: template
    name: ${device_name}_ir_captured
    id: captured_ir
    update_interval: never
  - platform: template
    name: ${device_name}_ir_slots
    id: saved_ir_info
    update_interval: 1s
    lambda: |-
      std::string info = "红外槽位:\n";
      for (int i = 0; i < 10; i++) {
        if (!id(saved_ir_codes)[i].empty()) {
          std::string preview = id(saved_ir_codes)[i].substr(0, 15);
          info += "[" + std::to_string(i) + "] " + preview + "...\n";
        } else {
          info += "[" + std::to_string(i) + "] 空\n";
        }
      }
      return {info};

binary_sensor:
  - platform: gpio
    pin: 4
    name: ${device_name}_mmw
    device_class: occupancy
  - platform: gpio
    pin:
      number: 2
      mode:
        input: true
        pullup: true
      inverted: true
    name: ${device_name}_button
    internal: true
    on_press:
      then:
        - button.press: ${device_name}_reset_conf

sensor:
  - platform: wifi_signal
    name: ${device_name}_signal
    internal: true
  - platform: adc
    pin: 3
    name: ${device_name}_brightness
    attenuation: 12db
    update_interval: 5s
    filters:
      - lambda: return (3.0f - x) / 0.03f;
  - platform: ra2413mt
    move_distance:
      name: ${device_name}_move_distance
    move_energy:
      name: ${device_name}_move_energy
    static_distance:
      name: ${device_name}_static_distance
    static_energy:
      name: ${device_name}_static_energy

number:
  - platform: template
    name: ${device_name}_ir_slot
    id: ir_slot
    min_value: 0
    max_value: 9
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0
  - platform: ra2413mt
    max_move_distance:
      name: ${device_name}_max_move_distance
      default: 4.5
    max_static_distance:
      name: ${device_name}_max_static_distance
      default: 4.5
    move_sensitivity:
      name: ${device_name}_move_sensitivity
      default: 99
    static_sensitivity:
      name: ${device_name}_static_sensitivity
      default: 15
    unattended_duration:
      name: ${device_name}_unattended_duration
      default: 5

button:
  - platform: restart
    name: ${device_name}_reboot
    internal: true
  - platform: ra2413mt
    get_conf:
      name: ${device_name}_get_conf
      internal: true
    reset_conf:
      id: ${device_name}_reset_conf
      name: ${device_name}_reset_conf
      internal: true
  - platform: template
    name: 接收红外信号
    icon: mdi:remote
    on_press:
      - lambda: |-
          ESP_LOGI("IR", "请按遥控器按键...");
          id(status_led).turn_on().set_brightness(0.3).set_rgb(255, 255, 0).perform();
  - platform: template
    name: 保存到槽位
    icon: mdi:content-save
    on_press:
      - lambda: |-
          int slot = id(ir_slot).state;
          std::string code = id(temp_ir_code);
          if (code.empty()) {
            ESP_LOGE("IR", "没有捕获红外码");
            return;
          }
          id(saved_ir_codes)[slot] = code;
          ESP_LOGI("IR", "已保存到槽位 %d", slot);
          id(saved_ir_info).update();
          id(status_led).turn_on().set_brightness(0.5).set_rgb(0, 255, 0).perform();
          delay(200);
          id(status_led).turn_off();
  - platform: template
    name: 发送槽位信号
    icon: mdi:send
    on_press:
      - lambda: |-
          int slot = id(ir_slot).state;
          std::string code = id(saved_ir_codes)[slot];
          if (code.empty()) {
            ESP_LOGE("IR", "槽位 %d 为空", slot);
            return;
          }
          ESP_LOGI("IR", "发送槽位 %d", slot);
          id(status_led).turn_on().set_brightness(0.5).set_rgb(0, 0, 255).perform();
  - platform: template
    name: 清空槽位
    icon: mdi:delete
    on_press:
      - lambda: |-
          int slot = id(ir_slot).state;
          id(saved_ir_codes)[slot] = "";
          ESP_LOGI("IR", "已清空槽位 %d", slot);
          id(saved_ir_info).update();

remote_transmitter:
  id: ir_tx
  pin: 1
  carrier_duty_percent: 50%

remote_receiver:
  pin:
    number: 0
    inverted: true
  dump: raw
  on_raw:
    then:
      - lambda: |-
          std::string raw_str;
          for (auto v : x) {
            raw_str += to_string(v) + ",";
          }
          if (!raw_str.empty()) raw_str.pop_back();
          id(temp_ir_code) = raw_str;
          id(captured_ir).state = raw_str;
          ESP_LOGI("IR", "捕获: %s", raw_str.c_str());
          id(status_led).turn_on().set_brightness(0.5).set_rgb(0, 255, 0).perform();
          delay(100);
          id(status_led).turn_off();
