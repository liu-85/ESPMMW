substitutions:
  device_name: espmmw01

esphome:
  name: ${device_name}
  friendly_name: espmmw01
  on_boot:
    priority: -100
    then:
      - delay: 5s

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino
    version: latest

external_components:
  - source: github://liu-85/ESPMMW
    components: [ra2413mt]

logger:
  level: debug

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 5min

ota:
  - platform: esphome
    password: !secret ota_password
  - platform: web_server

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: on

web_server:
  port: 80
  version: 3
  include_internal: true

uart:
  - id: ra2413mt_uart
    rx_pin: 5
    tx_pin: 6
    baud_rate: 256000
    data_bits: 8
    stop_bits: 1

ra2413mt:
  uart_id: ra2413mt_uart

light:
  - platform: esp32_rmt_led_strip
    id: status_led
    pin: GPIO7
    num_leds: 1
    chipset: WS2812
    rgb_order: GRB
    name: ${device_name}_status_led
    restore_mode: ALWAYS_OFF

globals:
  - id: saved_ir_codes
    type: std::array<std::string, 10>
    restore_value: no
    initial_value: '{"", "", "", "", "", "", "", "", "", ""}'

text_sensor:
  - platform: wifi_info
    ip_address:
      name: ${device_name}_ip
      icon: mdi:ip-outline
      internal: true
    mac_address:
      name: ${device_name}_mac
      icon: mdi:map-marker-outline
      internal: true
  - platform: version
    name: ${device_name}_esphome_version
    icon: mdi:information
    internal: true
  - platform: template
    name: ${device_name}_captured_ir
    id: captured_ir
    icon: mdi:remote
    update_interval: never
  - platform: template
    name: ${device_name}_saved_ir_info
    id: saved_ir_info
    icon: mdi:format-list-bulleted
    update_interval: 1s
    lambda: |-
      std::string info = "已保存红外码 (槽位:前20字符)";
      for (int i = 0; i < 10; i++) {
        if (!id(saved_ir_codes)[i].empty()) {
          std::string preview = id(saved_ir_codes)[i].substr(0, 20);
          info += "\n[" + std::to_string(i) + "] " + preview + "...";
        } else {
          info += "\n[" + std::to_string(i) + "] (空)";
        }
      }
      return {info};

binary_sensor:
  - platform: gpio
    pin: 4
    name: ${device_name}_mmw
    device_class: occupancy
    icon: mdi:motion-sensor
  - platform: gpio
    pin:
      number: 2
      mode:
        input: true
        pullup: true
      inverted: true
    name: ${device_name}_button
    icon: mdi:radiobox-marked
    internal: true
    on_press:
      then:
        - button.press: ${device_name}_reset_conf

sensor:
  - platform: wifi_signal
    name: ${device_name}_signal
    icon: mdi:signal
    internal: true
  - platform: adc
    pin: 3
    name: ${device_name}_brightness
    attenuation: 12db
    update_interval: 5s
    unit_of_measurement: "lx"
    icon: mdi:brightness-6
    accuracy_decimals: 0
    filters:
      - lambda: "return (3 - x) / 0.03;"
  - platform: internal_temperature
    name: ${device_name}_cpu_temperature
    icon: mdi:thermometer
    internal: true
  - platform: ra2413mt
    move_distance:
      name: ${device_name}_move_distance
    move_energy:
      name: ${device_name}_move_energy
    static_distance:
      name: ${device_name}_static_distance
    static_energy:
      name: ${device_name}_static_energy

number:
  - platform: ra2413mt
    max_move_distance:
      name: ${device_name}_max_move_distance
      default: 4.5
    max_static_distance:
      name: ${device_name}_max_static_distance
      default: 4.5
    move_sensitivity:
      name: ${device_name}_move_sensitivity
      default: 99
    static_sensitivity:
      name: ${device_name}_static_sensitivity
      default: 15
    unattended_duration:
      name: ${device_name}_unattended_duration
      default: 5
  - platform: template
    name: ${device_name}_ir_slot
    id: ir_slot
    min_value: 0
    max_value: 9
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0

button:
  - platform: restart
    name: ${device_name}_reboot
    internal: true
  - platform: ra2413mt
    get_conf:
      name: ${device_name}_get_conf
      internal: true
    reset_conf:
      id: ${device_name}_reset_conf
      name: ${device_name}_reset_conf
      internal: true
  - platform: template
    name: ${device_name}_ir_save_to_slot
    icon: mdi:content-save
    on_press:
      - lambda: |-
          int slot = id(ir_slot).state;
          std::string code = id(captured_ir).state;
          if (code.empty()) {
            ESP_LOGE("IR", "没有捕获到红外码");
            return;
          }
          id(saved_ir_codes)[slot] = code;
          ESP_LOGI("IR", "已保存到槽位 %d", slot);
          id(saved_ir_info).update();
          auto call = id(status_led).turn_on();
          call.set_brightness(0.5);
          call.set_rgb(0, 255, 0);
          call.perform();
          delay(200);
          id(status_led).turn_off();
  - platform: template
    name: ${device_name}_ir_send_slot
    icon: mdi:send
    on_press:
      - remote_transmitter.transmit_raw:
          carrier_frequency: 38kHz
          code: !lambda |-
            int slot = id(ir_slot).state;
            std::string code = id(saved_ir_codes)[slot];
            if (code.empty()) return std::vector<int>();
            std::vector<int> raw;
            size_t pos = 0, last = 0;
            while ((pos = code.find(",", last)) != std::string::npos) {
              raw.push_back(std::stoi(code.substr(last, pos - last)));
              last = pos + 1;
            }
            raw.push_back(std::stoi(code.substr(last)));
            return raw;
  - platform: template
    name: ${device_name}_ir_delete_slot
    icon: mdi:delete
    on_press:
      - lambda: |-
          int slot = id(ir_slot).state;
          id(saved_ir_codes)[slot] = "";
          ESP_LOGI("IR", "已删除槽位 %d", slot);
          id(saved_ir_info).update();

remote_transmitter:
  id: my_remote_transmitter
  pin: 1
  carrier_duty_percent: 50%

remote_receiver:
  pin:
    number: 0
    inverted: true
  dump: all
  on_raw:
    then:
      - lambda: |-
          std::string raw_str;
          for (auto i : x) {
            raw_str += to_string(i) + ",";
          }
          if (!raw_str.empty()) raw_str.pop_back();
          id(captured_ir).state = raw_str;
          id(captured_ir).update();
          ESP_LOGI("IR", "捕获: %s", raw_str.c_str());
          auto call = id(status_led).turn_on();
          call.set_brightness(0.3);
          call.set_rgb(0, 255, 0);
          call.perform();
          delay(50);
          id(status_led).turn_off();
