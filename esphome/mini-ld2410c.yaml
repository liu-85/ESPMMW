substitutions:
  device_name: mini-ld2410c
esphome:
  name: ${device_name}
  friendly_name: mini-ld2410c
  on_boot:
    priority: -100
    then:
      - delay: 5s

esp32:
  board: esp32dev
  framework:
    type: arduino
    version: latest

logger:
  level: debug
debug:
  update_interval: 5s
# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 5min
# ota 也需要更新
ota:
  - platform: esphome
    password: !secret ota_password
  - platform: web_server
# wifi 保持不变
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: on

web_server:
  port: 80
  version: 3
  include_internal: true


uart:
  id: ld2410_uart
  tx_pin: GPIO17
  rx_pin: GPIO21
  baud_rate: 256000
  data_bits: 8
  stop_bits: 1

ld2410:
  uart_id: ld2410_uart
  id: ld2410_comp

binary_sensor:
  - platform: ld2410
    has_target:
      name: 存在 P
    has_moving_target:
      name: 移动目标 M
    has_still_target:
      name: 静止目标 S
  - platform: gpio
    name: "LD2410C 人体感应"
    id: ld2410c
    pin:
      number: GPIO16   
      mode: INPUT_PULLUP # 稳定模式
    device_class: motion
    filters:
      - delayed_off: 3s  # 人走延时 3 秒，可改
sensor:
  - platform: ld2410
    moving_distance:
      name: 移动距离 Dm
    still_distance:
      name: 静止距离 Ds
    moving_energy:
      name: 移动能量 Em
    still_energy:
      name: 静止能量 Es
    detection_distance:
      name: 检测距离 D

switch:
  - platform: ld2410
    engineering_mode:
      name: 工程模式 EM
    bluetooth:
      name: 传感器蓝牙 BLE
      restore_mode: ALWAYS_OFF

button:
  - platform: ld2410
    query_params:
      name: 查询参数 Q
    restart:
      name: 传感器重启 R
    factory_reset:
      name: 出厂重置 FR

number:
  - platform: ld2410
    timeout:
      name: 超时 T
    max_move_distance_gate:
      name: 最大移动距离门限 GM
    max_still_distance_gate:
      name: 最大静止距离门限 GS
    light_threshold:
      name: 光阈值 LT

text_sensor:
  - platform: ld2410
    version:
      name: 固件版本 FW
    mac_address:
      name: 蓝牙MAC MAC
