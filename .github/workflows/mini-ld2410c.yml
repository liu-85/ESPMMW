name: ESPHome minild2410c

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        default: ''
  push:
    branches:
      - main
    paths:
      - 'esphome/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        device: [minild2410c]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create secrets.yaml
        run: |
          cat > esphome/secrets.yaml << EOF
          wifi_ssid: "${{ secrets.WIFI_SSID }}"
          wifi_password: "${{ secrets.WIFI_PASSWORD }}"
          ota_password: "${{ secrets.OTA_PASSWORD }}"
          api_encryption_key: "${{ secrets.API_ENCRYPTION_KEY }}"
          ha_url: "${{ secrets.HA_URL }}"
          ha_token: "${{ secrets.HA_TOKEN }}"
          EOF

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ESPHome
        run: |
          pip install --upgrade pip
          pip install esphome==2025.7.5

      - name: Build Firmware
        run: esphome compile esphome/${{ matrix.device }}.yaml

      - name: Upload Firmware Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.device }}-firmware
          # 使用通配符递归查找所有生成的 bin 和 elf
          path: |
            **/firmware.bin
            **/firmware.elf
          retention-days: 7
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    # 仅在手动触发并输入版本号时执行
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: minild2410c-firmware
          path: output

      - name: Prepare Release Assets
        run: |
          # 稳健提取 bin 文件
          find output/ -name "firmware.bin" -exec mv {} minild2410c.bin \;

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ESPHome Firmware ${{ github.event.inputs.version }}
          draft: false
          files: minild2410c.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    needs: [build, release]
    runs-on: ubuntu-latest
    if: success() && github.event_name == 'workflow_dispatch'
    steps:
      - name: Notify Home Assistant
        run: |
          curl -X POST "${{ secrets.HA_URL }}/api/webhook/firmware_available" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.HA_TOKEN }}" \
            -d '{
              "version": "${{ github.event.inputs.version }}",
              "devices": ["minild2410c"],
              "release_url": "https://github.com/${{ github.repository }}/releases/tag/${{ github.event.inputs.version }}"
            }'
