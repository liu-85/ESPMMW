name: Build ESPHome

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install ESPHome
        run: pip install esphome
      
      - name: Compile ESPHome
        run: esphome compile esphome/master_espmmw01.yaml
      
      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: esphome/.pioenvs/master_espmmw01/firmware.bin
